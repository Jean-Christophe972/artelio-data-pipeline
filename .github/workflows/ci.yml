name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualite-et-tests:
    name: Analyse statique et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances
        run: pip install -r docker/pipeline/requirements.txt pytest==8.4.2 ruff==0.13.0 && pip install --no-deps -e .
      - name: Ruff (PEP 8, imports, bugs courants)
        run: ruff check . && ruff format --check .
      - name: Tests unitaires
        run: pytest -q

  dags:
    name: Intégrité des DAG Airflow
    runs-on: ubuntu-latest
    needs: qualite-et-tests
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image Airflow
        run: docker build -f docker/airflow/Dockerfile -t artelio-airflow:ci .
      - name: Chargement des DAG
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=false -e PG_PASSWORD=ci -e S3_ACCESS_KEY=ci -e S3_SECRET_KEY=ci \
            artelio-airflow:ci bash -c "pip install -q pytest==8.4.2 && airflow db migrate > /dev/null && python -m pytest -q tests/test_dags.py"
